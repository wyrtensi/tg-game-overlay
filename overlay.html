<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay</title>
    <link rel="stylesheet" href="/src/overlay/overlay.css" />
    <script type="module" src="/src/overlay/main.ts" defer></script>
  </head>
  <body>
    <div id="hotkey-warning" class="hotkey-warning" role="alert" hidden></div>
    <div id="feed-zone" class="zone zone--feed" hidden>
      <div id="feed" class="feed"></div>
    </div>

    <div id="direction-layer" class="direction-layer" hidden aria-live="polite">
      <div id="direction-signal" class="direction-signal">
        <span id="direction-signal-author" class="direction-signal__author" hidden></span>
        <svg class="direction-signal__arrow" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 40V9M11 22l13-13 13 13" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>

    <div id="phrase-signal-layer" class="phrase-signal-layer" hidden aria-live="polite">
      <div id="phrase-signal" class="phrase-signal">
        <span id="phrase-signal-author" class="phrase-signal__author" hidden></span>
        <span id="phrase-signal-text" class="phrase-signal__text"></span>
      </div>
    </div>

    <div id="phrase-wheel-layer" class="phrase-wheel" hidden aria-live="polite">
      <div class="phrase-wheel__hint" data-i18n>Отпустите над фразой, чтобы отправить · центр — отмена</div>
      <div class="phrase-wheel__centre" aria-hidden="true">
        <span class="phrase-wheel__cancel-icon">×</span>
        <span class="phrase-wheel__cancel-label" data-i18n>Отмена</span>
      </div>
      <div id="phrase-wheel-labels" class="phrase-wheel__labels"></div>
    </div>

    <div id="media-lightbox" class="media-lightbox" hidden role="dialog" aria-modal="true" aria-label="Просмотр изображения" data-i18n-attr="aria-label">
      <div class="media-lightbox__toolbar">
        <span class="media-lightbox__title" data-i18n>Просмотр фото</span>
        <button id="media-lightbox-close" class="media-lightbox__close" type="button" aria-label="Закрыть фото" data-i18n-attr="aria-label">
          <span aria-hidden="true">×</span>
          <span data-i18n>Закрыть</span>
          <kbd>Esc</kbd>
        </button>
      </div>
      <img id="media-lightbox-image" alt="Полноразмерное изображение" data-i18n-attr="alt" />
      <div class="media-lightbox__hint" data-i18n>Чтобы вернуться к чату, нажмите Esc или щёлкните вне фото</div>
    </div>

    <div id="input-zone" class="input-zone" hidden>
      <div id="pending-attachment" class="pending-attachment" hidden>
        <img id="pending-attachment-preview" class="pending-attachment__preview" alt="" />
        <button id="pending-attachment-remove" type="button" class="pending-attachment__remove" data-i18n>
          Убрать
        </button>
      </div>
      <div id="sticker-panel" class="sticker-panel" hidden></div>
      <div id="send-status" class="send-status" hidden></div>
      <div class="input-row">
        <button id="attachment-toggle" type="button" class="attachment-toggle" aria-label="Добавить фото или GIF" data-i18n-attr="aria-label">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M8 12.5 14.5 6a3 3 0 0 1 4.2 4.2l-8.4 8.4a5 5 0 0 1-7.1-7.1L12 2.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
        </button>
        <input id="attachment-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
        <button id="sticker-toggle" type="button" class="sticker-toggle" aria-label="Стикеры" data-i18n-attr="aria-label">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="M7 3h8l6 6v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <path d="M15 3v4a2 2 0 0 0 2 2h4" fill="none" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </button>
        <textarea
          id="input"
          class="input"
          rows="1"
          placeholder="Написать сообщение..." data-i18n-attr="placeholder"></textarea>
      </div>
    </div>

    <div id="markup" class="markup" hidden>
      <div id="markup-rect-inactive" class="markup-rect markup-rect--inactive" hidden></div>
      <div id="markup-rect-active" class="markup-rect markup-rect--active" hidden></div>
      <div id="markup-size" class="markup-size" hidden></div>
      <div id="markup-hint" class="markup-hint"></div>
      <div id="markup-actions" class="markup-actions" hidden>
        <button id="markup-save" type="button" data-i18n>Сохранить</button>
        <button id="markup-customize-active" type="button" data-i18n>Настроить область открытого чата</button>
        <button id="markup-cancel-customize" type="button" hidden data-i18n>Не менять</button>
      </div>
    </div>
  </body>
</html>
