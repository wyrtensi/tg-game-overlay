name: release server

# Push a tag like server-v1.0.0 to publish the relay server image to GHCR and a
# GitHub release with the compose bundle.
on:
  push:
    tags: ["server-v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tg-game-overlay-server

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#server-v}"
          package=$(node -p "require('./server/package.json').version")
          test "$version" = "$package" || { echo "tag $GITHUB_REF_NAME does not match server/package.json $package"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=End-to-end encrypted relay server for tg-game-overlay
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Bundle compose files
        run: |
          name="tg-game-overlay-server-${{ steps.version.outputs.version }}"
          mkdir -p "dist/$name/scripts"
          cp server/docker-compose.yml server/.env.example server/README.md server/PROTOCOL.md server/package.json server/package-lock.json "dist/$name/"
          cp server/scripts/upload-stickers.mjs "dist/$name/scripts/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          name: Relay server ${{ steps.version.outputs.version }}
          make_latest: false
          files: dist/*.tar.gz
          body: |
            Self-hosted, end-to-end encrypted relay server for tg-game-overlay.

            ```sh
            docker pull ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ```

            Unpack the bundle, copy `.env.example` to `.env`, fill in `ACCESS_KEY` and `ADMIN_KEY` (`openssl rand -base64 32`) and run `docker compose up -d`. See README.md inside the bundle.
